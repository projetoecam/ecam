spring.application.name=ecam
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:5433};databaseName=DB_MANDATO;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Define a plataforma com a classe moderna do Hibernate 6+
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# SOBRESCREVE o dialeto do PostgreSQL que está a vir do application.properties base
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Estratégia individual para evitar falha no 'sp_fkeys' do SQL Server
spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually

# Desabilita a inspeção automática de metadados de chaves estrangeiras
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Desativa a estratégia que gera nomes com underscore
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl