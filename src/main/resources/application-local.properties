spring.application.name=ecam
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:5444};databaseName=DB_MANDATO;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
#spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# Força o Spring/Hibernate a usar uma estratégia de paginação compatível com SQL Server sem o ORDER BY
#spring.jpa.properties.hibernate.query.use_fetch_first_without_order_by=true

# Desabilita a inspeção automática de metadados de chaves estrangeiras
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Desativa a estratégia que gera nomes com underscore
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
